<div class="form-grid">
  <div class="field span-2"><label>Nombre del producto *</label><input type="text" name="name" required value="{{ p.name if p }}" placeholder="Ej. Brackets metálicos Roth 0.022 (kit 20)"></div>
  <div class="field"><label>SKU / código</label><input type="text" name="sku" value="{{ p.sku if p }}" placeholder="Se genera si lo dejas vacío"></div>
  <div class="field"><label>Marca</label><input type="text" name="brand" value="{{ p.brand if p }}"></div>
  <div class="field"><label>Categoría</label><select name="category">{% for c in categories %}<option {{ 'selected' if p and p.category == c }}>{{ c }}</option>{% endfor %}</select></div>
  <div class="field"><label>Unidad</label><select name="unit">{% for u in units %}<option {{ 'selected' if p and p.unit == u }}>{{ u }}</option>{% endfor %}</select></div>
  <div class="field"><label>Stock mínimo (alerta de reorden)</label><input type="number" step="0.01" min="0" name="min_stock" value="{{ p.min_stock if p else 2 }}"></div>
  <div class="field"><label>Ubicación</label><input type="text" name="location" value="{{ p.location if p }}" placeholder="Vitrina A, Gaveta 2…"></div>
  <div class="field"><label>Costo unitario</label><input type="number" step="0.01" min="0" name="cost_price" value="{{ p.cost_price if p else '' }}"></div>
  <div class="field"><label>Precio de venta</label><input type="number" step="0.01" min="0" name="sale_price" value="{{ p.sale_price if p else '' }}"><div class="hint">Para ventas de mostrador a colegas o pacientes.</div></div>
  <div class="field"><label>Proveedor</label><input type="text" name="supplier" value="{{ p.supplier if p }}"></div>
  <div class="field" style="align-self:center"><label class="check"><input type="checkbox" name="tracks_expiry" {{ 'checked' if not p or p.tracks_expiry }}> Este producto tiene caducidad</label></div>
  <div class="field span-2"><label>Notas</label><input type="text" name="notes" value="{{ p.notes if p }}"></div>
</div>
