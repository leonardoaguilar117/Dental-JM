{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <div class="card card-pad" style="max-width:420px;text-align:center">
    <div style="font-size:42px;font-weight:800;color:var(--brand)">{{ code }}</div>
    <h1 style="margin:6px 0 8px">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
    <a class="btn btn-primary mt" href="/">Volver al inicio</a>
  </div>
</div>
{% endblock %}
