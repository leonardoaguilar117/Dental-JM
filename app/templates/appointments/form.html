{% extends "base.html" %}
{% block title %}Nueva cita{% endblock %}
{% block content %}
{% set pf = prefill or {} %}
<div class="page-head"><div><h1>Agendar cita</h1></div></div>
<form method="post" action="/citas/nueva" class="card card-pad" style="max-width:820px">
  <div class="form-grid">
    <div class="field span-2"><label>Paciente *</label>
      <select name="patient_id" required>
        <option value="">Selecciona un paciente…</option>
        {% for p in patients %}<option value="{{ p.id }}" {{ 'selected' if patient_id == p.id }}>{{ p.full_name }}{% if p.phone %} · {{ p.phone }}{% endif %}</option>{% endfor %}
      </select>
      <div class="hint">¿Paciente nuevo? <a href="/pacientes/nuevo">Regístralo primero</a>.</div>
    </div>
    <div class="field"><label>Doctor(a)</label>
      <select name="doctor_id">{% for d in doctors %}<option value="{{ d.id }}" {{ 'selected' if (pf.doctor_id|default(user.id|string)) == d.id|string }}>{{ d.full_name }}</option>{% endfor %}</select></div>
    <div class="field"><label>Tipo de cita</label>
      <select name="type" id="type">{% for t in types %}<option {{ 'selected' if pf.type == t }}>{{ t }}</option>{% endfor %}</select></div>
    <div class="field"><label>Fecha y hora de inicio *</label><input type="datetime-local" name="start" required value="{{ start.strftime('%Y-%m-%dT%H:%M') }}" step="900"></div>
    <div class="field"><label>Duración</label>
      <select name="duration" id="duration">{% for m in [15, 30, 45, 60, 90, 120, 180] %}<option value="{{ m }}" {{ 'selected' if (pf.duration|default('60')) == m|string }}>{{ m }} min</option>{% endfor %}</select></div>
    <div class="field span-2"><label>Notas</label><textarea name="notes" placeholder="Indicaciones, material a preparar, estudios que debe traer…">{{ pf.notes }}</textarea></div>
  </div>
  {% if prefill %}<label class="check mb" style="color:var(--bad)"><input type="checkbox" name="force" value="1"> Agendar de todos modos (ignorar conflicto)</label>{% endif %}
  <div class="actions"><button class="btn btn-primary">Agendar cita</button><a class="btn" href="/agenda">Cancelar</a></div>
</form>
{% endblock %}
{% block scripts %}
<script>
// Duración sugerida según el tipo de cita
document.getElementById("type").addEventListener("change", (e) => {
  const v = e.target.value, dur = document.getElementById("duration");
  if (v === "Extracción / cirugía") dur.value = "120";
  else if (v === "Ajuste de ortodoncia" || v === "Valoración") dur.value = "30";
  else if (v === "Colocación de brackets / alineadores" || v === "Carillas / coronas" || v === "Diseño de sonrisa") dur.value = "90";
  else dur.value = "60";
});
</script>
{% endblock %}
