# Blueprint de Render: crea el servicio web (Docker) + una base PostgreSQL.
# Render > New > Blueprint > selecciona el repositorio.
services:
  - type: web
    name: consultorio-dental-jm
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    branch: main
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Contraseña inicial de jimena y carlos (obligatoria la primera vez; mínimo 10 caracteres)
      - key: DEMO_PASSWORD
        sync: false
      # Base vacía → cuentas de los doctores y 4 pacientes de ejemplo ("demo" carga la demostración completa)
      - key: SEED
        value: inicial
      - key: TZ_CONSULTORIO
        value: America/Mexico_City
      - key: WHATSAPP_COUNTRY_CODE
        value: "52"
      - key: DATABASE_URL
        fromDatabase:
          name: consultorio-jm-db
          property: connectionString
      # Opcional: pega aquí el JSON completo de la cuenta de servicio de Google
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: consultorio-jm-db
    plan: free
    databaseName: consultorio_jm
    user: consultorio
