# Blueprint de Render: servicio web (Docker) con la base SQLite dentro del contenedor, en DATA_DIR (/var/data).
# Render > New > Blueprint > selecciona el repositorio.
#
# Por ahora, plan gratuito SIN disco: la base se borra en cada despliegue y cada vez que el servicio se duerme.
# Para conservar los datos, cambia a un plan de pago y monta un disco en /var/data: descomenta el bloque "disk"
# y cambia "plan: free" por "plan: starter" (o agrégalo en el panel: Disks > Add Disk, Mount Path /var/data).
# La app no necesita ningún otro cambio: sigue usando /var/data.
services:
  - type: web
    name: consultorio-dental-jm
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # disk:                # aquí vivirá la base (crm_dental.db): sobrevive despliegues y reinicios
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    branch: main
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Contraseña inicial de jimena y carlos (obligatoria la primera vez; mínimo 10 caracteres)
      - key: DEMO_PASSWORD
        sync: false
      # Base vacía → cuentas de los doctores y 4 pacientes de ejemplo ("demo" carga la demostración completa)
      - key: SEED
        value: inicial
      - key: TZ_CONSULTORIO
        value: America/Mexico_City
      - key: WHATSAPP_COUNTRY_CODE
        value: "52"
      - key: DATA_DIR
        value: /var/data
      # Opcional: pega aquí el JSON completo de la cuenta de servicio de Google
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

