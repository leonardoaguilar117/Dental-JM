# Blueprint de Render: servicio web (Docker) con la base SQLite dentro del contenedor, en un disco persistente.
# Render > New > Blueprint > selecciona el repositorio.
services:
  - type: web
    name: consultorio-dental-jm
    runtime: docker
    plan: starter          # los discos persistentes requieren plan de pago
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    disk:                  # aquí vive la base (crm_dental.db): sobrevive despliegues y reinicios
      name: datos
      mountPath: /var/data
      sizeGB: 1
    branch: main
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Contraseña inicial de jimena y carlos (obligatoria la primera vez; mínimo 10 caracteres)
      - key: DEMO_PASSWORD
        sync: false
      # Base vacía → cuentas de los doctores y 4 pacientes de ejemplo ("demo" carga la demostración completa)
      - key: SEED
        value: inicial
      - key: TZ_CONSULTORIO
        value: America/Mexico_City
      - key: WHATSAPP_COUNTRY_CODE
        value: "52"
      - key: DATA_DIR
        value: /var/data
      # Opcional: pega aquí el JSON completo de la cuenta de servicio de Google
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

